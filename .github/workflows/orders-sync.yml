name: Atualizar snapshot de pedidos

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overwine-orders-sync
  cancel-in-progress: false

jobs:
  sync:
    # Uma execução por backend. São PROJETOS SEPARADOS, com Redis separados:
    # o oficial e o isolado de preview. Antes deste arquivo só o oficial era
    # sincronizado, e o snapshot do preview ficou parado de 13 a 17/08/2026 —
    # o chatbot passou a recusar consultas de "ontem" por falta de cobertura.
    name: Sincronizar pedidos (${{ matrix.nome }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Um backend fora do ar NAO pode impedir a sincronizacao do outro.
      fail-fast: false
      matrix:
        include:
          - nome: oficial
            url: https://overwine-assistant.vercel.app/api/admin/orders-sync
            secret: OVERWINE_ADMIN_KEY
          - nome: preview
            url: https://overwine-assistant-preview.vercel.app/api/admin/orders-sync
            secret: OVERWINE_PREVIEW_ADMIN_KEY

    steps:
      - name: Validar configuração
        shell: bash
        env:
          ADMIN_KEY: ${{ secrets[matrix.secret] }}
          NOME_SECRET: ${{ matrix.secret }}
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::O secret $NOME_SECRET não está configurado."
            exit 1
          fi

      - name: Executar sincronização
        shell: bash
        env:
          ADMIN_KEY: ${{ secrets[matrix.secret] }}
          SYNC_URL: ${{ matrix.url }}
          # O endpoint lê no máximo ORDERS_SYNC_MAX_PAGES (5) páginas por
          # invocação e devolve committedOffset para retomar. Repetimos até
          # concluir em vez de esperar a próxima hora: uma chamada por hora
          # levaria dias para recuperar um atraso grande.
          # Teto de 6: o rate limit do endpoint é 10 chamadas por 10 minutos.
          MAX_PASSOS: '6'
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          passo=1
          while [ "$passo" -le "$MAX_PASSOS" ]; do
            echo "── Passo $passo de $MAX_PASSOS ──"

            http_code="$(
              curl \
                --silent \
                --show-error \
                --location \
                --request POST \
                --url "$SYNC_URL" \
                --header "Content-Type: application/json" \
                --header "x-admin-key: $ADMIN_KEY" \
                --data '{"alvo":"ativos"}' \
                --connect-timeout 15 \
                --max-time 120 \
                --output "$response_file" \
                --write-out "%{http_code}"
            )"

            echo "HTTP: $http_code"
            echo "Resposta:"
            cat "$response_file"
            echo

            if [ "$http_code" = "429" ]; then
              echo "::warning::Rate limit atingido no passo $passo. O offset confirmado está salvo; a próxima execução continua daqui."
              exit 0
            fi

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::O endpoint respondeu HTTP $http_code."
              exit 1
            fi

            set +e
            python3 - "$response_file" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          try:
              with open(path, "r", encoding="utf-8") as arquivo:
                  resposta = json.load(arquivo)
          except Exception as erro:
              print(f"::error::Resposta não é um JSON válido: {erro}")
              raise SystemExit(1)

          ok = resposta.get("ok")
          concluido = resposta.get("concluido")
          retomavel = resposta.get("retomavel")
          motivo = resposta.get("motivo")
          paginas = resposta.get("paginasLidas")
          offset = resposta.get("committedOffset")
          novos = resposta.get("novosPedidos")

          print(
              "Resultado: "
              f"ok={ok}, "
              f"concluido={concluido}, "
              f"retomavel={retomavel}, "
              f"motivo={motivo}, "
              f"paginasLidas={paginas}, "
              f"committedOffset={offset}, "
              f"novosPedidos={novos}"
          )

          if ok is not True:
              print(
                  "::error::A sincronização respondeu "
                  f"ok=false. Motivo: {motivo or 'não informado'}."
              )
              raise SystemExit(1)

          if concluido is True:
              raise SystemExit(0)

          # `sem_novos` é SUCESSO, não falha: a sincronização incremental leu as
          # páginas, não achou pedido novo nem alterado, e por isso não publicou
          # versão nova. O job foi encerrado e o status gravado — não há o que
          # retomar, e é exatamente por isso que `retomavel` vem false.
          #
          # Entre 17/08/2026 e 24/08/2026 esta linha não existia e a condição
          # abaixo tratava esse estado como fatal. Resultado: 34 das 60 últimas
          # execuções ficaram vermelhas com o backend funcionando perfeitamente,
          # os dois backends em uníssono, em 4 a 6 segundos. Ver o teste
          # "6. nada novo e nada alterado" em tests/orders-sync.service.test.ts,
          # que trava o contrato do qual esta regra depende.
          if motivo == "sem_novos":
              print("Nada novo desde a última sincronização; snapshot mantido.")
              raise SystemExit(0)

          if retomavel is not True:
              print(
                  "::error::O passo não concluiu e não é retomável. "
                  f"Motivo: {motivo or 'não informado'}."
              )
              raise SystemExit(1)

          raise SystemExit(10)
          PY
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Sincronização concluída em $passo passo(s)."
              exit 0
            fi

            if [ "$status" -ne 10 ]; then
              exit "$status"
            fi

            passo=$((passo + 1))
            sleep 5
          done

          echo "::warning::Ainda parcial após $MAX_PASSOS passos. O offset confirmado está salvo; a próxima execução continua daqui."

  # ──────────────────────────────────────────────────────────────────────
  # Logística por envio. Job SEPARADO de propósito: depende do snapshot de
  # pedidos, mas uma falha aqui não pode sujar a sincronização de vendas, que
  # é a fonte de verdade.
  #
  # A API de pedidos do ML devolve shipping.id mas NÃO shipping.logistic_type.
  # Sem esse campo o cálculo de custo soma embalagem em toda venda, inclusive
  # nas do Full, onde o Mercado Livre é quem embala. Este job resolve cada
  # envio UMA VEZ — envio despachado não muda de logística.
  #
  # Um job por backend, mesmo padrão do job `sync`: são PROJETOS SEPARADOS,
  # com Redis separados, portanto cada um tem o SEU mapa de envios. Até
  # 24/08/2026 este job só chamava o preview, sob o comentário de que o oficial
  # não tinha o endpoint — os dois deploys rodam o mesmo código, e o resultado
  # foi o mapa do oficial ficar vazio enquanto o cálculo de custo já dependia
  # dele.
  # ──────────────────────────────────────────────────────────────────────
  logistica:
    name: Resolver logistica de envios (${{ matrix.nome }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sync
    # Roda mesmo se a sincronização de pedidos falhar: o snapshot anterior
    # continua válido e ainda há envios antigos a resolver.
    if: always()

    strategy:
      # Um backend fora do ar NAO pode impedir a resolucao do outro.
      fail-fast: false
      matrix:
        include:
          - nome: oficial
            url: https://overwine-assistant.vercel.app/api/admin/shipping-sync
            secret: OVERWINE_ADMIN_KEY
          - nome: preview
            url: https://overwine-assistant-preview.vercel.app/api/admin/shipping-sync
            secret: OVERWINE_PREVIEW_ADMIN_KEY

    steps:
      - name: Executar passo de logistica
        shell: bash
        env:
          ADMIN_KEY: ${{ secrets[matrix.secret] }}
          NOME_SECRET: ${{ matrix.secret }}
          SYNC_URL: ${{ matrix.url }}
          # 4 passos x 300 envios = 1.200 por hora. O backfill inicial de ~3.500
          # termina em 3 horas. Depois só entram envios novos, poucos por hora.
          MAX_PASSOS: '4'
          LOTE: '300'
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::O secret $NOME_SECRET nao esta configurado."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          passo=1
          while [ "$passo" -le "$MAX_PASSOS" ]; do
            echo "-- Passo $passo de $MAX_PASSOS --"

            http_code="$(
              curl --silent --show-error --location --request POST \
                --url "$SYNC_URL" \
                --header "Content-Type: application/json" \
                --header "x-admin-key: $ADMIN_KEY" \
                --data "{\"limite\":$LOTE}" \
                --connect-timeout 15 --max-time 180 \
                --output "$response_file" --write-out "%{http_code}"
            )"

            echo "HTTP: $http_code"
            cat "$response_file"
            echo

            # 409 = outro passo em andamento; 429 = rate limit. Nenhum e erro:
            # o mapa e aditivo e a proxima execucao continua de onde parou.
            if [ "$http_code" = "409" ] || [ "$http_code" = "429" ]; then
              echo "::warning::Passo $passo nao executou (HTTP $http_code). A proxima execucao continua."
              exit 0
            fi

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::O endpoint respondeu HTTP $http_code."
              exit 1
            fi

            set +e
            python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], "r", encoding="utf-8") as arquivo:
                  resposta = json.load(arquivo)
          except Exception as erro:
              print(f"::error::Resposta nao e um JSON valido: {erro}")
              raise SystemExit(1)

          cobertura = resposta.get("cobertura")
          pct = f"{cobertura:.1%}" if isinstance(cobertura, (int, float)) else "?"

          print(
              "Resultado: "
              f"buscados={resposta.get('buscados')}, "
              f"resolvidos={resposta.get('resolvidos')}, "
              f"falhas={resposta.get('falhas')}, "
              f"restantes={resposta.get('restantes')}, "
              f"cobertura={pct}"
          )

          if resposta.get("ok") is not True:
              print("::error::A resolucao de logistica respondeu ok=false.")
              raise SystemExit(1)

          raise SystemExit(0 if resposta.get("concluido") is True else 10)
          PY
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Logistica completa em $passo passo(s)."
              exit 0
            fi
            if [ "$status" -ne 10 ]; then exit "$status"; fi

            passo=$((passo + 1))
            sleep 3
          done

          echo "::warning::Ainda faltam envios apos $MAX_PASSOS passos. A proxima execucao continua daqui."